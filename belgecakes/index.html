<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Rate your visit — Belge Cakes & More</title>
  <meta name="description" content="Loved your cake? Leave a quick Google review for Belge Cakes & More." />
  <meta name="robots" content="noindex, nofollow" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #111111;
      --white:  #ffffff;
      --off:    #f7f6f4;
      --border: #e4e2de;
      --muted:  #888580;
      --gold:   #c9951a;
      --gold-tint: #fbf3e2;
      --radius: 14px;
      --font:   -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--off);
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 40px;
      position: relative;
    }

    /* Hero */
    .hero {
      width: 100%;
      background: var(--black);
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero-stars { font-size: 24px; letter-spacing: 4px; color: var(--gold); margin-bottom: 14px; }
    .hero-name  { font-size: 22px; font-weight: 600; color: var(--white); margin-bottom: 5px; }
    .hero-sub   { font-size: 13px; color: #777; }

    /* Body */
    .body {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prompt {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      padding: 0 8px;
    }

    .reviews-label, .own-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding-left: 2px;
    }

    /* Review cards */
    .review-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 44px 14px 14px;
      cursor: pointer;
      position: relative;
      transition: border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .review-card:active { background: #fafaf8; }
    .review-card.selected { border-color: var(--black); }
    .review-card p { font-size: 14px; line-height: 1.65; color: #333; }

    .rdot {
      position: absolute;
      top: 14px; right: 14px;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      transition: border-color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .review-card.selected .rdot { border-color: var(--black); background: var(--black); }
    .rdot::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--white);
      opacity: 0;
      transition: opacity .15s;
    }
    .review-card.selected .rdot::after { opacity: 1; }

    /* Own review */
    .own-wrap {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .15s;
    }
    .own-wrap:focus-within { border-color: var(--black); }
    .own-textarea {
      width: 100%;
      min-height: 96px;
      border: none; outline: none; resize: none;
      font-family: var(--font);
      font-size: 14px; line-height: 1.65;
      color: #333; background: transparent;
      padding: 14px;
    }
    .own-textarea::placeholder { color: #bbb; }
    .own-char { font-size: 11px; color: var(--muted); padding: 0 14px 10px; text-align: right; }

    /* Divider */
    .divider { display: flex; align-items: center; gap: 10px; }
    .divider-line { flex: 1; height: 0.5px; background: var(--border); }
    .divider-text { font-size: 12px; color: #bbb; white-space: nowrap; }

    /* Buttons */
    .btn-copy {
      width: 100%; padding: 13px;
      border-radius: var(--radius);
      border: 1.5px solid #e8cf94;
      background: var(--gold-tint);
      font-family: var(--font);
      font-size: 14px; font-weight: 600;
      color: #8a6410;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background .15s, border-color .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-copy:active { background: #f5e9cf; transform: scale(.98); }
    .btn-copy.copied { border-color: #1a7a3c; color: #1a7a3c; background: #eaf6ee; }
    .btn-copy svg { stroke: currentColor; }

    .btn-google {
      width: 100%; padding: 15px;
      border-radius: var(--radius);
      border: none;
      background: var(--black);
      font-family: var(--font);
      font-size: 15px; font-weight: 600;
      color: var(--white);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: opacity .15s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .btn-google:active { opacity: .85; }
    .g-svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1a1a1a; color: #fff;
      font-size: 13px; padding: 10px 20px;
      border-radius: 24px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .footer {
      margin-top: 10px;
      font-size: 11px; color: #ccc;
      text-align: center; padding: 0 16px;
    }

    /* Star burst intro — bubbles out of the 5th star, then falls */
    .star-burst-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
    .burst-star {
      position: absolute;
      color: #d8ab2e;
      text-shadow: 0 1px 3px rgba(0,0,0,.28);
      opacity: 0;
      will-change: transform, opacity;
      animation-name: starFall;
      animation-timing-function: cubic-bezier(.33,.05,.4,1);
      animation-fill-mode: forwards;
    }
    @keyframes starFall {
      0%   { transform: translate(0, 0) scale(var(--s0)) rotate(0deg); opacity: 0; animation-timing-function: cubic-bezier(.34,1.35,.64,1); }
      10%  { transform: translate(var(--x1), var(--y1)) scale(var(--s1)) rotate(var(--spin1)); opacity: 1; animation-timing-function: cubic-bezier(.37,0,.63,1); }
      100% { transform: translate(var(--x2), var(--fall-dist)) scale(var(--s2)) rotate(var(--spin2)); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      .burst-star { display: none; }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="star-burst-layer" id="star-burst-layer" aria-hidden="true"></div>

  <div class="hero">
    <div class="hero-stars"><span>★</span><span>★</span><span>★</span><span>★</span><span id="last-star">★</span></div>
    <div class="hero-name">Belge Cakes & More</div>
    <div class="hero-sub">Cake shop &amp; bakery &nbsp;·&nbsp; Mahalunge, Pune</div>
  </div>

  <div class="body">

    <p class="prompt">Loved your cake?<br>Pick a review or write your own — takes 10 seconds.</p>

    <span class="reviews-label">Choose a review</span>

    <div class="review-card selected" id="card-1" onclick="selectCard(1)" role="radio" aria-checked="true" tabindex="0">
      <div class="rdot"></div>
      <p id="review-text-1"></p>
    </div>

    <div class="review-card" id="card-2" onclick="selectCard(2)" role="radio" aria-checked="false" tabindex="0">
      <div class="rdot"></div>
      <p id="review-text-2"></p>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or write your own</span>
      <div class="divider-line"></div>
    </div>

    <span class="own-label">Write your own</span>
    <div class="own-wrap">
      <textarea
        class="own-textarea"
        id="own-review"
        placeholder="Tell us what you loved about Belge"
        maxlength="500"
        oninput="onOwnInput(this)"
        aria-label="Write your own review"
      ></textarea>
      <div class="own-char" id="char-count">0 / 500</div>
    </div>

    <button class="btn-copy" id="copy-btn" onclick="copyReview()" aria-label="Copy review text">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span id="copy-label">Copy review</span>
    </button>

    <a
      class="btn-google"
      href="https://search.google.com/local/writereview?placeid=ChIJEdsXXYK_wjsRhU9iYvXI3Go"
      target="_blank"
      rel="noopener"
      aria-label="Open Google Reviews for Belge Cakes & More"
    >
      <svg class="g-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57C21.36 18.01 22.56 15.36 22.56 12.25z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Open Google Reviews
    </a>

    <p class="footer">Powered by Tap2Loop &nbsp;·&nbsp; takes 10 seconds</p>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  /* ── Review pool — 20 options, 2 shown randomly each load ── */
  const ALL_REVIEWS = [
    "Ordered a custom cake from Belge and it was  better than I ever imagined very well designed, perfectly soft, and absolutely delicious Highly recommend!!",
    "The pastries here are fresh, rich, and made with great quality ingredients. Definitely coming back for more.",
    "Belge is one of the best cake shops in the Mahalunge. Great flavour variety and beautiful presentation.",
    "Ordered a birthday cake and it was a huge hit everyone loved the soft and full of flavour cake. The design was exactly what we asked for.",
    "Really impressed with the customisation options and how similar the cake looked to the photo we sent. Tastes was also on point.",
    "Friendly staff, excellent service, and top-notch cakes. Will definitely order again.",
    "Belge Cakes & More in Mahalunge is our go-to cake shop for every celebration now. Great taste, great design, and always delivered on time.",
    "Ordered a photo cake for my daughter's birthday and the detailing was spot on. Soft sponge, not overly sweet, and everyone loved it.",
    "Great quality bakery in Mahalunge, Pune fresh pastries, perfect amount of cream, and the staff is always helpful with customisation.",
    "The Dutch Truffle and Blueberry Cheesecake here are must-tries.Fresh and tasty every visit.",
    "Belge made our anniversary extra special the cake was beautifully decorated and tasted incredible. Highly recommend for special occasions.",
    "The Mousse cake and the french macarons were surprisingly good, loved to find such variety here in Mahalunge",
    "Reliable bakery for last-minute birthday orders quick turnaround, best ingredients, and the cakes always taste great.",
    "Ambience is very cute and cosy next to the cakes, my go to spot whenever i crave some sweet treat. ",
    "Best pastries in Mahalunge the prices are totally worth it.",
    "Great experience ordering cakes online smooth process, timely delivery, and the cakes tasted 👌🏻👌🏻.",
    "Belge's customised cakes are just on point the German Blackforest and Belge Rose all top-notch. Highly recommend for birthdays.",
    "Visited for a small get-together and had a few pastries they were fresh, well-made and reasonably priced for the quality.",
    "The staff were patient with our customisation requests and the final cake was even better than we expected. Great bakery in Mahalunge.",
    "Mini fresh fruit cake and the sugar free cakes are my go to as I always look for healthy options."
  ];

  /* Pick 2 unique random reviews */
  function pickTwo(arr) {
    const shuffled = [...arr].sort(() => Math.random() - 0.5);
    return [shuffled[0], shuffled[1]];
  }

  const [review1, review2] = pickTwo(ALL_REVIEWS);
  document.getElementById('review-text-1').textContent = review1;
  document.getElementById('review-text-2').textContent = review2;

  /* Active reviews map for copy */
  const activeReviews = { 1: review1, 2: review2 };

  /* ── State ── */
  let selectedCard = 1;

  /* ── Select card ── */
  function selectCard(n) {
    selectedCard = n;
    document.getElementById('own-review').value = '';
    document.getElementById('char-count').textContent = '0 / 500';
    [1, 2].forEach(i => {
      const el = document.getElementById('card-' + i);
      el.classList.toggle('selected', i === n);
      el.setAttribute('aria-checked', i === n);
    });
  }

  /* ── Own review input ── */
  function onOwnInput(el) {
    const len = el.value.length;
    document.getElementById('char-count').textContent = len + ' / 500';
    if (len > 0) {
      selectedCard = 0;
      [1, 2].forEach(i => {
        document.getElementById('card-' + i).classList.remove('selected');
        document.getElementById('card-' + i).setAttribute('aria-checked', 'false');
      });
    } else {
      selectCard(1);
    }
  }

  /* ── Get active text ── */
  function getActiveReview() {
    const own = document.getElementById('own-review').value.trim();
    if (own.length > 0) return own;
    return activeReviews[selectedCard] || activeReviews[1];
  }

  /* ── Copy ── */
  function copyReview() {
    const text = getActiveReview();
    const btn = document.getElementById('copy-btn');
    const label = document.getElementById('copy-label');

    const finish = () => {
      btn.classList.add('copied');
      label.textContent = 'Copied!';
      showToast('Copied — now tap Open Google Reviews and paste');
      setTimeout(() => { btn.classList.remove('copied'); label.textContent = 'Copy review'; }, 3000);
    };

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
    } else {
      fallbackCopy(text, finish);
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    cb();
  }

  /* ── Toast ── */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  /* ── Keyboard support ── */
  document.querySelectorAll('.review-card').forEach(card => {
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
    });
  });

  /* ── Star burst intro animation ── */
  /* Stars bubble out from the 5th star in the hero, then fall down
     the page in one smooth continuous motion over a solid 3-4s,
     with varied sizes and left/right scatter as they fall. */
  function runStarBurst() {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    const layer = document.getElementById('star-burst-layer');
    const lastStar = document.getElementById('last-star');
    if (!layer || !lastStar) return;

    const rect = lastStar.getBoundingClientRect();
    const originCenterX = rect.left + rect.width / 2;
    const originTop = rect.top + rect.height * 0.5;
    const vh = window.innerHeight;

    const count = 20;
    const emitWindow = 1.0; // all bubbles emerge within 1s so the whole effect lands as one solid 3-4s beat

    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'burst-star';

      // Bimodal size mix so some bubbles clearly read bigger, some smaller
      const size = Math.random() < 0.5
        ? 9 + Math.random() * 8     // small: 9–17px
        : 20 + Math.random() * 16;  // big: 20–36px

      // Small jitter so they don't all stack exactly on one pixel
      const startX = originCenterX + (Math.random() * 14 - 7);
      const startY = originTop + (Math.random() * 5 - 2.5);

      const duration = 3 + Math.random() * 1;              // 3–4s, one solid smooth fall
      const delay = Math.random() * emitWindow;             // staggered emergence

      const x1 = Math.random() * 70 - 35;                  // wider emerge scatter, left or right
      const x2 = x1 + (Math.random() * 170 - 70);          // continues drifting further as it falls, biased slightly rightward

      const y1 = 16 + Math.random() * 12;                  // emerge offset
      const fallDist = (vh - startY) + 40 + Math.random() * 60; // continue past viewport bottom

      const spin1 = Math.random() * 40 - 20;
      const spin2 = spin1 + (Math.random() * 140 - 70);

      const s0 = 0.15 + Math.random() * 0.1;                // start tiny
      const s1 = 1.05 + Math.random() * 0.15;               // pop slightly past full size
      const s2 = 0.8 + Math.random() * 0.15;                // settle a bit smaller by the end

      star.textContent = '★';
      star.style.left = startX + 'px';
      star.style.top = startY + 'px';
      star.style.fontSize = size + 'px';
      star.style.setProperty('--x1', x1 + 'px');
      star.style.setProperty('--x2', x2 + 'px');
      star.style.setProperty('--y1', y1 + 'px');
      star.style.setProperty('--fall-dist', fallDist + 'px');
      star.style.setProperty('--spin1', spin1 + 'deg');
      star.style.setProperty('--spin2', spin2 + 'deg');
      star.style.setProperty('--s0', s0);
      star.style.setProperty('--s1', s1);
      star.style.setProperty('--s2', s2);
      star.style.animationDuration = duration + 's';
      star.style.animationDelay = delay + 's';

      layer.appendChild(star);

      // Clean up after it finishes so the layer doesn't accumulate nodes
      star.addEventListener('animationend', () => star.remove());
    }

    // Safety cleanup in case some animationend events don't fire
    setTimeout(() => { layer.innerHTML = ''; }, (emitWindow + 4.2) * 1000);
  }

  // Run after layout settles so getBoundingClientRect on the 5th star is accurate
  requestAnimationFrame(() => requestAnimationFrame(runStarBurst));
</script>

</body>
</html>
