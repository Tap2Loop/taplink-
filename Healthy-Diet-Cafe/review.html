<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Rate your visit — Healthy Diet Cafe</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7f3; --surface: #ffffff; --border: #dde8d8;
      --green: #3a7d44; --green-dk: #2e6337;
      --muted: #6b7a65; --black: #1a1f18; --white: #ffffff;
      --success: #3a7d44; --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    html, body { min-height: 100%; background: var(--bg); font-family: var(--font); color: var(--black); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 48px; position: relative; }

    /* ── Compact Hero ── */
    .hero {
      width: 100%;
      background: var(--green);
      padding: 18px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hero-left { display: flex; flex-direction: column; gap: 2px; }
    .hero-name { font-size: 17px; font-weight: 700; color: var(--white); letter-spacing: -0.2px; }
    .hero-sub { font-size: 11px; color: rgba(255,255,255,.6); }
    .hero-stars { font-size: 18px; letter-spacing: 2px; color: #f5d060; flex-shrink: 0; }
    .hero-stars span:last-child { position: relative; }
    #last-star { display: inline-block; }

    /* ── Body ── */
    .body { width: 100%; max-width: 420px; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 14px; }
    .prompt { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; padding: 0 8px; }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

    /* ── Review cards ── */
    .review-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 44px 14px 14px; cursor: pointer; position: relative; transition: border-color .15s; -webkit-tap-highlight-color: transparent; }
    .review-card:active { background: #f7fbf6; }
    .review-card.selected { border-color: var(--green); }
    .review-card p { font-size: 14px; line-height: 1.65; color: #333; }
    .rdot { position: absolute; top: 14px; right: 14px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; transition: border-color .15s, background .15s; }
    .review-card.selected .rdot { border-color: var(--green); background: var(--green); }
    .rdot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--white); opacity: 0; transition: opacity .15s; }
    .review-card.selected .rdot::after { opacity: 1; }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 10px; }
    .divider-line { flex: 1; height: 0.5px; background: var(--border); }
    .divider-text { font-size: 12px; color: #bbb; white-space: nowrap; }

    /* ── Own review ── */
    .own-wrap { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .15s, background .15s; cursor: pointer; position: relative; }
    .own-wrap:focus-within { border-color: var(--green); }
    .own-wrap.copied { border-color: var(--success); background: #eaf6ee; }
    .own-textarea { width: 100%; min-height: 58px; border: none; outline: none; resize: none; font-family: var(--font); font-size: 14px; line-height: 1.55; color: var(--black); background: transparent; padding: 12px 14px 4px; cursor: pointer; }
    .own-textarea::placeholder { color: #bbb; }
    .own-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 14px 10px; }
    .own-char { font-size: 11px; color: var(--muted); }
    .own-tap-hint { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; transition: color .15s; }
    .own-wrap.copied .own-tap-hint { color: var(--success); font-weight: 600; }
    .btn-google { width: 100%; padding: 15px; border-radius: var(--radius); border: none; background: var(--green); font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
    .btn-google:active { opacity: .85; }
    .g-svg { width: 18px; height: 18px; flex-shrink: 0; }

    .footer { margin-top: 10px; font-size: 11px; color: #bbb; text-align: center; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(12px); background: #1a1a1a; color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 24px; white-space: nowrap; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Star burst (green stars) ── */
    .star-burst-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .burst-star { position: absolute; color: #f5d060; text-shadow: 0 1px 3px rgba(0,0,0,.2); opacity: 0; will-change: transform, opacity; animation-name: starFall; animation-timing-function: cubic-bezier(.33,.05,.4,1); animation-fill-mode: forwards; }
    @keyframes starFall {
      0%   { transform: translate(0,0) scale(var(--s0)) rotate(0deg); opacity: 0; animation-timing-function: cubic-bezier(.34,1.35,.64,1); }
      10%  { transform: translate(var(--x1),var(--y1)) scale(var(--s1)) rotate(var(--spin1)); opacity: 1; animation-timing-function: cubic-bezier(.37,0,.63,1); }
      100% { transform: translate(var(--x2),var(--fall-dist)) scale(var(--s2)) rotate(var(--spin2)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } .burst-star { display: none; } }
  </style>
</head>
<body>
<div class="page">

  <div class="star-burst-layer" id="star-burst-layer" aria-hidden="true"></div>

  <div class="hero">
    <div class="hero-left">
      <div class="hero-name">Healthy Diet Cafe</div>
      <div class="hero-sub">Hinjewadi &nbsp;·&nbsp; Pune</div>
    </div>
    <div class="hero-stars">
      <span>★</span><span>★</span><span>★</span><span>★</span><span id="last-star">★</span>
    </div>
  </div>

  <div class="body">
    <p class="prompt">Hope you enjoyed your meal!<br>Pick or write your own review, barely takes a few seconds.</p>

    <span class="section-label">Choose a review</span>

    <div class="review-card selected" id="card-1" onclick="selectCard(1)" role="radio" aria-checked="true" tabindex="0">
      <div class="rdot"></div>
      <p id="review-text-1"></p>
    </div>

    <div class="review-card" id="card-2" onclick="selectCard(2)" role="radio" aria-checked="false" tabindex="0">
      <div class="rdot"></div>
      <p id="review-text-2"></p>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or write your own</span>
      <div class="divider-line"></div>
    </div>

    <span class="section-label">Write your own</span>
    <div class="own-wrap" id="own-wrap" onclick="copyOwn()">
      <textarea class="own-textarea" id="own-review" placeholder="Tap here to type — tap again to copy" maxlength="500" oninput="onOwnInput(this)" aria-label="Write your own review"></textarea>
      <div class="own-footer">
        <span class="own-char" id="char-count">0 / 500</span>
        <span class="own-tap-hint" id="tap-hint">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Tap to copy
        </span>
      </div>
    </div>

    <a class="btn-google" href="https://maps.google.com/?cid=ChIJ9xuxjHi7wjsR69nrtm9AS_M" target="_blank" rel="noopener">
      <svg class="g-svg" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57C21.36 18.01 22.56 15.36 22.56 12.25z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      PASTE it on Google Reviews
    </a>

    <p class="footer">
      <span class="footer-line"></span>
      <span>Powered by Tap2Loop</span>
      <span class="footer-line"></span>
    </p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const ALL_REVIEWS = [
    "Honestly one of those places where you finish your meal and actually feel good about what you ate. Fresh ingredients and real flavours not just salad leaves thrown together.",
    "Been coming here for a while now and it never disappoints. The food is clean without being boring and the portions are actually filling which is rare for a health cafe.",
    "Finally found a place in Pune where eating healthy doesnt feel like a punishment. Everything tasted fresh and the menu had way more variety than I expected.",
    "Went in for a quick lunch and ended up staying longer than planned because the food was genuinely that good. The kind of place you tell your friends about.",
    "The meals here are exactly what I needed. Nothing heavy nothing oily just good clean food that actually tastes like something. Will be coming back regularly.",
    "Really impressed with how much thought goes into the menu here. You can tell its made with actual care not just thrown together. Great spot for a healthy meal in Pune.",
    "Had the salad bowl and honestly it was better than I expected. Nice balance of flavours and the ingredients were super fresh. Definitely coming back to try more things.",
    "Love that this place exists in Pune. Ate here after the gym and it was exactly what I needed. Light filling and actually delicious which is hard to pull off.",
    "The food here is genuinely good not just healthy for the sake of it. You actually want to eat it which says a lot. Prices are fair too for the quality you get.",
    "Came in on a recommendation and completely understood why. Simple menu done well with fresh ingredients. One of those spots that becomes a regular without you even planning it.",
    "Really appreciate that the food is tasty without being heavy. The kind of place that makes you realise healthy eating doesnt have to be boring or bland.",
    "Ordered a couple of things and everything came out fresh and well made. Staff were friendly and quick. Exactly what a good health cafe should feel like.",
    "Solid healthy food options that actually taste great. Not your typical bland diet food at all. The portions were generous and left me genuinely satisfied.",
    "One of the better healthy eating spots I have found in Pune. Feels like they actually put thought into the recipes rather than just cutting out the oil and calling it healthy.",
    "Was pleasantly surprised by how good the food was here. Came in expecting basic health food and got something genuinely enjoyable. Will definitely be back."
  ];

  function pickTwo(arr) {
    const s = [...arr].sort(() => Math.random() - 0.5);
    return [s[0], s[1]];
  }

  const [r1, r2] = pickTwo(ALL_REVIEWS);
  document.getElementById('review-text-1').textContent = r1;
  document.getElementById('review-text-2').textContent = r2;
  const active = { 1: r1, 2: r2 };
  let selected = 1;

  function selectCard(n) {
    selected = n;
    document.getElementById('own-review').value = '';
    document.getElementById('char-count').textContent = '0 / 500';
    [1,2].forEach(i => {
      const el = document.getElementById('card-' + i);
      el.classList.toggle('selected', i === n);
      el.setAttribute('aria-checked', i === n);
    });
    // Copy the selected review text immediately on tap
    const text = active[n];
    if (!text) return;
    const card = document.getElementById('card-' + n);
    const done = () => {
      card.style.borderColor = 'var(--success)';
      showToast('Copied — now paste on Google Reviews');
      setTimeout(() => { card.style.borderColor = ''; }, 2500);
    };
    navigator.clipboard ? navigator.clipboard.writeText(text).then(done).catch(() => fbCopy(text, done)) : fbCopy(text, done);
  }

  function onOwnInput(el) {
    document.getElementById('char-count').textContent = el.value.length + ' / 500';
    if (el.value.length > 0) {
      selected = 0;
      [1,2].forEach(i => {
        document.getElementById('card-' + i).classList.remove('selected');
        document.getElementById('card-' + i).setAttribute('aria-checked','false');
      });
    } else { selectCard(1); }
  }

  // Tap own-wrap to copy whatever is typed inside
  function copyOwn() {
    const text = document.getElementById('own-review').value.trim();
    if (!text) return; // nothing typed yet — let them type first
    const wrap = document.getElementById('own-wrap');
    const hint = document.getElementById('tap-hint');
    const done = () => {
      wrap.classList.add('copied');
      hint.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
      showToast('Copied — now paste on Google Reviews');
      setTimeout(() => {
        wrap.classList.remove('copied');
        hint.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Tap to copy';
      }, 3000);
    };
    navigator.clipboard ? navigator.clipboard.writeText(text).then(done).catch(() => fbCopy(text,done)) : fbCopy(text,done);
  }

  function fbCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta); cb();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  document.querySelectorAll('.review-card').forEach(c => {
    c.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); c.click(); } });
  });

  // Star burst — same as Belge, originates from the last star in the hero
  function runStarBurst() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = document.getElementById('star-burst-layer');
    const lastStar = document.getElementById('last-star');
    if (!layer || !lastStar) return;
    const rect = lastStar.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.5;
    const vh = window.innerHeight;
    const count = 20;
    const emitWindow = 1.0;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'burst-star';
      const size = Math.random() < 0.5 ? 9 + Math.random() * 8 : 20 + Math.random() * 16;
      const sx = cx + (Math.random() * 14 - 7);
      const sy = cy + (Math.random() * 5 - 2.5);
      const dur = 3 + Math.random() * 1;
      const delay = Math.random() * emitWindow;
      const x1 = Math.random() * 70 - 35;
      const x2 = x1 + (Math.random() * 170 - 70);
      const y1 = 16 + Math.random() * 12;
      const fallDist = (vh - sy) + 40 + Math.random() * 60;
      const spin1 = Math.random() * 40 - 20;
      const spin2 = spin1 + (Math.random() * 140 - 70);
      const s0 = 0.15 + Math.random() * 0.1;
      const s1 = 1.05 + Math.random() * 0.15;
      const s2 = 0.8 + Math.random() * 0.15;
      star.textContent = '★';
      star.style.left = sx + 'px';
      star.style.top = sy + 'px';
      star.style.fontSize = size + 'px';
      star.style.setProperty('--x1', x1 + 'px');
      star.style.setProperty('--x2', x2 + 'px');
      star.style.setProperty('--y1', y1 + 'px');
      star.style.setProperty('--fall-dist', fallDist + 'px');
      star.style.setProperty('--spin1', spin1 + 'deg');
      star.style.setProperty('--spin2', spin2 + 'deg');
      star.style.setProperty('--s0', s0);
      star.style.setProperty('--s1', s1);
      star.style.setProperty('--s2', s2);
      star.style.animationDuration = dur + 's';
      star.style.animationDelay = delay + 's';
      layer.appendChild(star);
      star.addEventListener('animationend', () => star.remove());
    }
    setTimeout(() => { layer.innerHTML = ''; }, (emitWindow + 4.2) * 1000);
  }

  requestAnimationFrame(() => requestAnimationFrame(runStarBurst));
</script>
</body>
</html>
