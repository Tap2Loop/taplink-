<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — RAHI Cà-phê Vietnam</title>
<style>
  :root{--ink:#1a3a2a;--paper:#f5f0e8;--white:#ffffff;--line:#e4e1da;--muted:#6a7a70;--gold:#b6862c;--gold-soft:#f8efdc;--green:#2d6a4f;--green-soft:#e8f5ee;}
  *{box-sizing:border-box;}html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;}

  /* ---- LOCK SCREEN ---- */
  #lockScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lock-box{background:var(--white);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(26,58,42,.08);}
  .lock-logo{font-size:32px;margin-bottom:12px;}
  .lock-title{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .lock-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
  .lock-input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px;color:var(--ink);}
  .lock-input:focus{outline:none;border-color:var(--ink);}
  .lock-btn{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  .lock-btn:active{opacity:.85;}
  .lock-error{font-size:13px;color:#c0392b;margin-top:10px;min-height:20px;}

  /* ---- DASHBOARD ---- */
  #dashboard{display:none;}
  .topbar{background:var(--ink);color:#fff;padding:20px 24px 18px;}
  .topbar-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a0c0b0;margin-bottom:4px;}
  .topbar-title{font-family:Georgia,serif;font-size:22px;font-weight:700;}
  .topbar-sub{font-size:12px;color:#a0c0b0;margin-top:2px;}

  .content{padding:24px 20px;max-width:700px;margin:0 auto;}

  /* stat cards */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
  .stat-card{background:var(--white);border-radius:14px;padding:18px 14px;text-align:center;border:1.5px solid var(--line);}
  .stat-card.highlight{border-color:var(--gold);background:var(--gold-soft);}
  .stat-num{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--ink);line-height:1;}
  .stat-card.highlight .stat-num{color:var(--gold);}
  .stat-label{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3;}

  /* member table */
  .section-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  .member-list{display:flex;flex-direction:column;gap:10px;}
  .member-card{background:var(--white);border-radius:12px;padding:14px 16px;border:1.5px solid var(--line);display:flex;align-items:center;gap:14px;}
  .member-avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
  .member-info{flex:1;min-width:0;}
  .member-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .member-phone{font-size:12px;color:var(--muted);margin-top:1px;}
  .member-right{text-align:right;flex-shrink:0;}
  .visit-badge{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .reward-tag{font-size:11px;color:var(--gold);font-weight:600;margin-top:3px;}
  .member-date{font-size:11px;color:var(--muted);margin-top:2px;}

  .mini-bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;}
  .mini-bar-fill{height:100%;background:var(--ink);border-radius:2px;transition:width .4s;}

  .empty-state{text-align:center;padding:48px 0;color:var(--muted);font-size:14px;}

  .refresh-btn{display:flex;align-items:center;gap:6px;background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ink);cursor:pointer;margin-bottom:16px;font-weight:500;}
  .refresh-btn:active{background:var(--line);}

  .footer{text-align:center;font-size:11px;color:var(--muted);padding:24px 0 12px;letter-spacing:.06em;}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-logo">☕</div>
    <div class="lock-title">RAHI Dashboard</div>
    <div class="lock-sub">Enter your staff PIN to view member analytics</div>
    <input type="password" id="lockPin" class="lock-input" maxlength="4" inputmode="numeric" placeholder="••••">
    <button class="lock-btn" onclick="unlock()">View Dashboard</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-eyebrow">Owner Dashboard</div>
    <div class="topbar-title" id="dashCafeName">RAHI Cà-phê Vietnam</div>
    <div class="topbar-sub" id="dashLastUpdated">Loading...</div>
  </div>
  <div class="content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">Total Members</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statVisits">—</div>
        <div class="stat-label">Total Visits</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-num" id="statRewards">—</div>
        <div class="stat-label">Rewards Redeemed</div>
      </div>
    </div>

    <div class="section-title">All Members</div>
    <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
    <div class="member-list" id="memberList">
      <div class="empty-state">Loading members...</div>
    </div>
  </div>
  <div class="footer">Powered by TapReview</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL="https://gszhclrdisokzikewgbm.supabase.co";
  const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzemhjbHJkaXNva3ppa2V3Z2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTA5MDUsImV4cCI6MjA5Nzg2NjkwNX0.37t3LSM9At1q-nhiijb7Qh5U6C3gV1XUDe_OhIUYKhw";
  const CAFE_ID="rahi";
  const DASHBOARD_PIN="5678"; // same as staff PIN — change if you want a separate owner PIN
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  let cafeData=null;

  function unlock(){
    const pin=document.getElementById('lockPin').value.trim();
    if(pin===DASHBOARD_PIN){
      document.getElementById('lockScreen').style.display='none';
      document.getElementById('dashboard').style.display='block';
      loadDashboard();
    } else {
      document.getElementById('lockError').textContent="Incorrect PIN. Try again.";
      document.getElementById('lockPin').value='';
    }
  }
  document.getElementById('lockPin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});

  async function loadDashboard(){
    document.getElementById('dashLastUpdated').textContent="Updating...";

    // load cafe info
    const{data:cafe}=await db.from('cafes').select('name,total_slots,reward_config').eq('id',CAFE_ID).single();
    if(cafe){
      cafeData=cafe;
      document.getElementById('dashCafeName').textContent=cafe.name;
    }

    // load all members
    const{data:members,error}=await db
      .from('loyalty_customers')
      .select('name,phone,visit_count,last_visit_at,created_at')
      .eq('cafe_id',CAFE_ID)
      .order('last_visit_at',{ascending:false});

    if(error||!members){
      document.getElementById('memberList').innerHTML='<div class="empty-state">Could not load members.</div>';
      return;
    }

    // compute stats
    const totalMembers=members.length;
    const totalVisits=members.reduce((sum,m)=>sum+m.visit_count,0);

    // count rewards redeemed — a reward fires at visit counts matching reward_config keys
    let rewardsRedeemed=0;
    if(cafe){
      const rewardSlots=Object.keys(cafe.reward_config).map(Number);
      members.forEach(m=>{
        rewardSlots.forEach(slot=>{
          if(m.visit_count>=slot) rewardsRedeemed++;
        });
      });
    }

    document.getElementById('statTotal').textContent=totalMembers;
    document.getElementById('statVisits').textContent=totalVisits;
    document.getElementById('statRewards').textContent=rewardsRedeemed;
    document.getElementById('dashLastUpdated').textContent="Last updated: "+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

    // render member list
    if(members.length===0){
      document.getElementById('memberList').innerHTML='<div class="empty-state">No members yet. Share your QR code to get started!</div>';
      return;
    }

    const TOTAL=cafe?cafe.total_slots:10;
    const REWARDS=cafe?cafe.reward_config:{};
    const rewardSlots=Object.keys(REWARDS).map(Number).sort((a,b)=>a-b);

    const html=members.map(m=>{
      const initials=(m.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      const displayName=m.name||'Unknown';
      const phone=m.phone?"+91 "+m.phone.slice(0,5)+" "+m.phone.slice(5):'—';
      const visits=m.visit_count||0;
      const pct=Math.round((visits/TOTAL)*100);

      // find next reward or current unlocked reward
      const unlockedReward=REWARDS[String(visits)];
      const nextSlot=rewardSlots.find(s=>s>visits);
      const rewardText=unlockedReward
        ? `🎉 ${unlockedReward} unlocked`
        : nextSlot ? `${nextSlot-visits} visit${nextSlot-visits>1?'s':''} to ${REWARDS[String(nextSlot)]}` : 'Card complete';

      const lastVisit=m.last_visit_at
        ? new Date(m.last_visit_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})
        : '—';

      return `
        <div class="member-card">
          <div class="member-avatar">${initials}</div>
          <div class="member-info">
            <div class="member-name">${displayName}</div>
            <div class="member-phone">${phone}</div>
            <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="member-right">
            <div class="visit-badge">${visits}/${TOTAL}</div>
            <div class="reward-tag">${rewardText}</div>
            <div class="member-date">${lastVisit}</div>
          </div>
        </div>`;
    }).join('');

    document.getElementById('memberList').innerHTML=html;
  }
</script>
</body>
</html>
