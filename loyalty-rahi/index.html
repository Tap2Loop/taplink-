<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Loyalty — RAHI Cà-phê Vietnam</title>
<style>
  :root{--ink:#1a3a2a;--paper:#fff;--line:#e4e1da;--muted:#8a8580;--gold:#b6862c;--gold-soft:#f8efdc;--stamp-empty:#f1efe9;}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center}
  .screen{width:100%;max-width:480px;display:flex;flex-direction:column}
  .hero{background:var(--ink);color:#fff;padding:38px 28px 30px;text-align:center}
  .hero-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a0c0b0;margin-bottom:10px}
  .hero-name{font-family:Georgia,serif;font-size:28px;font-weight:700}
  .hero-sub{margin-top:6px;font-size:13px;color:#a0c0b0}
  .body{flex:1;padding:30px 24px 40px;display:flex;flex-direction:column;gap:22px}
  .hidden{display:none!important}
  #phoneState,#cardState{display:none;flex-direction:column;gap:14px}
  .field-label{font-size:14px;font-weight:600;margin-bottom:5px}
  .text-input{width:100%;padding:14px 16px;font-size:16px;border:1.5px solid var(--line);border-radius:10px}
  .text-input:focus{outline:none;border-color:var(--ink)}
  .btn-primary{width:100%;padding:16px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .greet-row{display:flex;align-items:baseline;justify-content:space-between}
  .greet{font-size:15px;color:var(--muted)}.greet strong{color:var(--ink)}
  .switch-number{font-size:12px;color:var(--muted);text-decoration:underline;background:none;border:none;cursor:pointer}
  .status-banner{border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;text-align:center}
  .status-banner.unlocked{border-color:var(--gold);background:var(--gold-soft)}
  .status-line{font-size:13px;color:var(--muted)}
  .status-banner.unlocked .status-line{color:#8a6315}
  .status-reward{margin-top:4px;font-family:Georgia,serif;font-size:20px;font-weight:700}
  .card-frame{border:1.5px solid var(--line);border-radius:14px;padding:22px 18px}
  .card-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;text-align:center}
  .stamp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .stamp{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--stamp-empty);position:relative}
  .stamp .num{font-size:10px;color:var(--muted);position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#fff;padding:0 4px}
  .stamp.filled{background:var(--ink);border-color:var(--ink)}
  .stamp.filled::after{content:"";width:9px;height:9px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
  .stamp.reward{background:#fff;border:1.5px dashed var(--gold)}
  .stamp.reward .reward-label{font-size:8px;line-height:1.15;text-align:center;color:var(--gold);font-weight:700;padding:0 3px}
  .stamp.reward.filled{background:var(--gold);border-style:solid;border-color:var(--gold)}
  .stamp.reward.filled .reward-label{color:#fff}
  .stamp.reward.filled::after{display:none}
  .staff-zone{border-top:1.5px dashed var(--line);padding-top:22px;display:flex;flex-direction:column;gap:10px}
  .staff-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
  .btn-staff{width:100%;padding:16px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .footer{text-align:center;font-size:11px;color:var(--muted);padding:18px 0 6px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,20,20,.55);align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
  .pin-input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px}
  .modal-actions{display:flex;gap:10px}
  .modal-actions button{flex:1;padding:13px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-cancel{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
  .btn-confirm{background:var(--ink);border:none;color:#fff}
</style>
</head>
<body>
<div class="screen">
  <div class="hero">
    <div class="hero-eyebrow">Loyalty Card</div>
    <div class="hero-name" id="cafeName">RAHI Cà-phê Vietnam</div>
  </div>
  <div class="body">
    <div id="phoneState">
      <div>
        <div class="field-label">Your name</div>
        <input type="text" id="nameInput" class="text-input" placeholder="Enter your name">
      </div>
      <div>
        <div class="field-label">Mobile number</div>
        <input type="tel" id="phoneInput" class="text-input" placeholder="10-digit mobile number" maxlength="10">
      </div>
      <button class="btn-primary" onclick="submitPhone()">Show my card</button>
    </div>

    <div id="cardState">
      <div class="greet-row">
        <div class="greet">Welcome back, <strong id="greetName"></strong></div>
        <button class="switch-number" onclick="resetCustomer()">Not you?</button>
      </div>
      <div id="statusBanner" class="status-banner">
        <div class="status-line" id="statusLine"></div>
        <div class="status-reward" id="statusReward"></div>
      </div>
      <div class="card-frame">
        <div class="card-title">Your Punch Card</div>
        <div class="stamp-grid" id="stampGrid"></div>
      </div>
      <div class="staff-zone">
        <div class="staff-label">For Staff Only</div>
        <button class="btn-staff" id="confirmBtn" onclick="openPinModal('confirm')">Confirm Visit</button>
        <button class="btn-staff hidden" id="resetBtn" onclick="openPinModal('reset')">Start New Card</button>
      </div>
    </div>
  </div>
  <div class="footer">Powered by TapReview</div>
</div>

<div class="modal-overlay" id="pinOverlay">
  <div class="modal">
    <h3>Staff PIN</h3>
    <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePinModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitPin()">Confirm</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
<script>
  /* --- SET YOUR SUPABASE URL AND KEY HERE --- */
  const SUPABASE_URL = "https://udmjsnmiseqngpaozqfx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3s4xVqoIrru1M8Sk_ILl9A_vg9zRGRM";
  
  const CAFE_ID = "rahi";
  const STORAGE_KEY = "loyalty_rahi";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let card = null;
  let pinAction = "confirm";

  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

  async function submitPhone(){
    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    if(!name) return showToast("Please enter your name");
    if(!/^\d{10}$/.test(phone)) return showToast("Enter a valid 10-digit number");

    localStorage.setItem(STORAGE_KEY, JSON.stringify({phone, name}));
    await loadCard(phone, name);
  }

  function resetCustomer(){
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('phoneState').style.display = 'flex';
    document.getElementById('cardState').style.display = 'none';
  }

  async function loadCard(phone, name){
    document.getElementById('phoneState').style.display = 'none';
    
    // Get card data
    const { data } = await db.rpc('get_my_card', { p_cafe_id: CAFE_ID, p_phone: phone });
    if(data) {
      card = data;
      // If they entered a name but DB has none, update DB
      if(name && !card.name) {
        await db.rpc('update_name', { p_cafe_id: CAFE_ID, p_phone: phone, p_name: name });
        card.name = name;
      }
      renderCard();
      document.getElementById('cardState').style.display = 'flex';
    }
  }

  function renderCard(){
    document.getElementById('greetName').textContent = card.name || "+91 " + card.phone;
    const TOTAL = card.total_slots, REWARDS = card.reward_config || {}, visits = card.visit_count;
    
    const grid = document.getElementById('stampGrid');
    grid.innerHTML = "";
    for (let i = 1; i <= TOTAL; i++) {
      const isReward = !!REWARDS[String(i)];
      const isFilled = i <= visits;
      const cell = document.createElement('div');
      cell.className = 'stamp' + (isReward ? ' reward' : '') + (isFilled ? ' filled' : '');
      
      const num = document.createElement('div');
      num.className = 'num'; num.textContent = i; cell.appendChild(num);
      
      if (isReward) {
        const lbl = document.createElement('div');
        lbl.className = 'reward-label'; lbl.textContent = REWARDS[String(i)]; cell.appendChild(lbl);
      }
      grid.appendChild(cell);
    }

    const banner = document.getElementById('statusBanner'), line = document.getElementById('statusLine'), rewardEl = document.getElementById('statusReward');
    const confirmBtn = document.getElementById('confirmBtn'), resetBtn = document.getElementById('resetBtn');
    
    banner.classList.remove('unlocked');
    if (card.card_completed) {
      banner.classList.add('unlocked'); line.textContent = "Card Completed";
      rewardEl.textContent = "🎉 " + (REWARDS[String(TOTAL)] || "Reward") + " — hand to staff";
      confirmBtn.classList.add('hidden'); resetBtn.classList.remove('hidden');
    } else {
      confirmBtn.classList.remove('hidden'); resetBtn.classList.add('hidden');
      if (REWARDS[String(visits)]) {
        banner.classList.add('unlocked'); line.textContent = "Visit " + visits + " of " + TOTAL;
        rewardEl.textContent = "🎉 " + REWARDS[String(visits)] + " unlocked!";
      } else {
        line.textContent = "Visit " + visits + " of " + TOTAL;
        const next = Object.keys(REWARDS).map(Number).sort((a,b)=>a-b).find(s => s > visits);
        rewardEl.textContent = next ? (next - visits) + " more visits to " + REWARDS[String(next)] : (TOTAL - visits) + " to complete card";
      }
    }
  }

  function openPinModal(action){
    pinAction = action;
    document.getElementById('pinOverlay').classList.add('show');
    document.getElementById('pinInput').value = ""; 
    setTimeout(()=>document.getElementById('pinInput').focus(), 100);
  }
  function closePinModal(){ document.getElementById('pinOverlay').classList.remove('show'); }

  async function submitPin(){
    const pin = document.getElementById('pinInput').value.trim();
    if (pin.length !== 4) return showToast("Enter 4-digit PIN");
    
    const fn = pinAction === 'reset' ? 'reset_card' : 'confirm_visit';
    const { data } = await db.rpc(fn, { p_cafe_id: CAFE_ID, p_phone: card.phone, p_pin: pin });
    
    if (!data || !data.success) return showToast(data?.error || "Incorrect PIN");
    
    closePinModal();
    if (pinAction === 'reset') {
      card.visit_count = 0; card.card_completed = false;
      showToast("New card started");
    } else {
      card.visit_count = data.new_count; card.card_completed = data.card_completed;
      showToast(data.reward_unlocked ? "🎉 " + data.reward_unlocked + " unlocked!" : "Visit confirmed!");
    }
    renderCard();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const {phone, name} = JSON.parse(saved);
      loadCard(phone, name);
    } else {
      document.getElementById('phoneState').style.display = 'flex';
    }
  });
</script>
</body>
</html>
