<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — RAHI Cà-phê Vietnam</title>
<style>
  :root{--ink:#1a3a2a;--paper:#f5f0e8;--white:#fff;--line:#e4e1da;--muted:#6a7a70;--gold:#b6862c;--gold-soft:#f8efdc;--red:#c0392b;--red-soft:#fdf0ee;}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
  #lockScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lock-box{background:var(--white);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(26,58,42,.08)}
  .lock-logo{font-size:32px;margin-bottom:12px}
  .lock-title{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .lock-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
  .lock-input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px;color:var(--ink)}
  .lock-input:focus{outline:none;border-color:var(--ink)}
  .lock-btn{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .lock-btn:active{opacity:.85}.lock-btn:disabled{opacity:.5;cursor:not-allowed}
  .lock-error{font-size:13px;color:var(--red);margin-top:10px;min-height:20px}
  #dashboard{display:none}
  .topbar{background:var(--ink);color:#fff;padding:20px 24px 18px}
  .topbar-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a0c0b0;margin-bottom:4px}
  .topbar-title{font-family:Georgia,serif;font-size:22px;font-weight:700}
  .topbar-sub{font-size:12px;color:#a0c0b0;margin-top:2px}
  .content{padding:24px 20px;max-width:760px;margin:0 auto}
  .toolbar{display:flex;gap:10px;margin-bottom:16px}
  .tool-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:500}
  .tool-btn:active{background:var(--line)}
  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px}
  @media(min-width:520px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
  .stat-card{background:var(--white);border-radius:14px;padding:18px 14px;text-align:center;border:1.5px solid var(--line)}
  .stat-card.highlight{border-color:var(--gold);background:var(--gold-soft)}
  .stat-card.alert{border-color:var(--red);background:var(--red-soft)}
  .stat-num{font-family:Georgia,serif;font-size:26px;font-weight:700;color:var(--ink);line-height:1}
  .stat-card.highlight .stat-num{color:var(--gold)}
  .stat-card.alert .stat-num{color:var(--red)}
  .stat-label{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
  .section-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px}
  .member-list{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
  .member-card{background:var(--white);border-radius:12px;padding:14px 16px;border:1.5px solid var(--line);display:flex;align-items:center;gap:14px}
  .member-card.risk{border-color:#f0c9c3;background:#fffaf9}
  .member-avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
  .member-info{flex:1;min-width:0}
  .member-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member-phone{font-size:12px;color:var(--muted);margin-top:1px}
  .member-right{text-align:right;flex-shrink:0}
  .visit-badge{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .reward-tag{font-size:11px;color:var(--gold);font-weight:600;margin-top:3px}
  .member-date{font-size:11px;color:var(--muted);margin-top:2px}
  .risk-tag{font-size:11px;color:var(--red);font-weight:600;margin-top:3px}
  .mini-bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .mini-bar-fill{height:100%;background:var(--ink);border-radius:2px;transition:width .4s}
  .empty-state{text-align:center;padding:32px 0;color:var(--muted);font-size:14px}
  .footer{text-align:center;font-size:11px;color:var(--muted);padding:24px 0 12px;letter-spacing:.06em}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-logo">☕</div>
    <div class="lock-title">RAHI Dashboard</div>
    <div class="lock-sub">Enter the owner PIN to view analytics</div>
    <input type="password" id="lockPin" class="lock-input" maxlength="4" inputmode="numeric" placeholder="••••">
    <button class="lock-btn" id="unlockBtn" onclick="unlock()">View Dashboard</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div class="topbar-eyebrow">Owner Dashboard</div>
    <div class="topbar-title" id="dashCafeName">RAHI Cà-phê Vietnam</div>
    <div class="topbar-sub" id="dashLastUpdated">—</div>
  </div>
  <div class="content">
    <div class="toolbar">
      <button class="tool-btn" onclick="refresh()">↻ Refresh</button>
      <button class="tool-btn" onclick="exportCsv()">⬇ Export CSV</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">Total Members</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statVisits">—</div>
        <div class="stat-label">Total Visits</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-num" id="statRewards">—</div>
        <div class="stat-label">Rewards Redeemed</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statNew7">—</div>
        <div class="stat-label">New (7 days)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statNew30">—</div>
        <div class="stat-label">New (30 days)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statActive">—</div>
        <div class="stat-label">Active (30 days)</div>
      </div>
    </div>

    <div class="section-title" id="atRiskTitle">At-Risk Members · 45+ days inactive</div>
    <div class="member-list" id="atRiskList"></div>

    <div class="section-title">All Members</div>
    <div class="member-list" id="memberList">
      <div class="empty-state">Unlock to load members...</div>
    </div>
  </div>
  <div class="footer">Powered by TapReview</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ---------- CONFIG ---------- */
  const SUPABASE_URL = "https://udmjsnmiseqngpaozqfx.supabase.co/rest/v1/";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkbWpzbm1pc2VxbmdwYW96cWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzM1OTEsImV4cCI6MjEwODM0OTU5MX0.LPCEv0k-GtVoBTkSe0QaytkK3g6MWSX3E4dm9Mr_d-w";
  const CAFE_ID = "rahi";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentPin = null;
  let latestData = null;

  const $ = id => document.getElementById(id);

  async function unlock(){
    const pin = $('lockPin').value.trim();
    if (pin.length !== 4) { $('lockError').textContent = "Enter the 4-digit owner PIN."; return; }
    const btn = $('unlockBtn');
    btn.disabled = true; btn.textContent = "Checking...";
    try {
      const { data, error } = await db.rpc('get_dashboard', { p_cafe_id: CAFE_ID, p_pin: pin });
      if (error) throw error;
      if (!data || !data.success) throw new Error(data?.error || "Incorrect PIN");
      currentPin = pin;
      latestData = data;
      $('lockScreen').style.display = "none";
      $('dashboard').style.display = "block";
      renderDashboard(data);
    } catch (e) {
      $('lockError').textContent = e.message || "Could not unlock.";
      $('lockPin').value = "";
    } finally {
      btn.disabled = false; btn.textContent = "View Dashboard";
    }
  }

  async function refresh(){
    if (!currentPin) return;
    try {
      const { data, error } = await db.rpc('get_dashboard', { p_cafe_id: CAFE_ID, p_pin: currentPin });
      if (error) throw error;
      if (!data || !data.success) throw new Error(data?.error || "Failed to refresh");
      latestData = data;
      renderDashboard(data);
    } catch (e) {
      alert(e.message || "Refresh failed");
    }
  }

  function renderDashboard(data){
    $('dashCafeName').textContent = data.name || "Cafe";
    $('dashLastUpdated').textContent = "Updated " +
      new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

    const m = data.metrics || {};
    $('statTotal').textContent   = m.total_members ?? 0;
    $('statVisits').textContent  = m.total_visits ?? 0;
    $('statRewards').textContent = m.rewards_redeemed ?? 0;
    $('statNew7').textContent    = m.new_members_7d ?? 0;
    $('statNew30').textContent   = m.new_members_30d ?? 0;
    $('statActive').textContent  = m.active_members_30d ?? 0;

    // At-risk
    const atRisk = data.at_risk || [];
    $('atRiskTitle').textContent = "At-Risk Members · 45+ days inactive · " + atRisk.length;
    if (atRisk.length === 0) {
      $('atRiskList').innerHTML = '<div class="empty-state">Everyone\'s active — nice!</div>';
    } else {
      $('atRiskList').innerHTML = atRisk.map(memberCardHtml(true, data)).join("");
    }

    // All members
    const members = data.members || [];
    if (members.length === 0) {
      $('memberList').innerHTML = '<div class="empty-state">No members yet.</div>';
    } else {
      $('memberList').innerHTML = members.map(memberCardHtml(false, data)).join("");
    }
  }

  function memberCardHtml(isRisk, data){
    return m => {
      const name = m.name || "Unknown";
      const initials = name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2) || "?";
      const phone = m.phone ? "+91 " + m.phone.slice(0,5) + " " + m.phone.slice(5) : "—";
      const visits = m.visit_count || 0;
      const TOTAL = data.total_slots || 10;
      const pct = Math.min(100, Math.round((visits / TOTAL) * 100));
      const lastVisit = m.last_visit_at
        ? new Date(m.last_visit_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })
        : 'Never';

      const REWARDS = data.reward_config || {};
      let tag = "";
      if (m.card_completed) tag = '🏆 Card complete';
      else if (REWARDS[String(visits)]) tag = '🎉 ' + REWARDS[String(visits)] + ' unlocked';
      else {
        const slots = Object.keys(REWARDS).map(Number).sort((a,b)=>a-b);
        const next = slots.find(s => s > visits);
        if (next) tag = (next - visits) + ' to ' + REWARDS[String(next)];
      }

      return `
        <div class="member-card ${isRisk ? 'risk' : ''}">
          <div class="member-avatar">${initials}</div>
          <div class="member-info">
            <div class="member-name">${escapeHtml(name)}</div>
            <div class="member-phone">${phone}</div>
            <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="member-right">
            <div class="visit-badge">${visits}/${TOTAL}</div>
            ${isRisk
              ? `<div class="risk-tag">Inactive</div>`
              : (tag ? `<div class="reward-tag">${escapeHtml(tag)}</div>` : ``)}
            <div class="member-date">${lastVisit}</div>
          </div>
        </div>`;
    };
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function csvEscape(v){
    if (v === null || v === undefined) return "";
    const s = String(v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCsv(){
    if (!latestData) return alert("Nothing to export yet.");
    const rows = [["name","phone","visit_count","last_visit_at","created_at","card_completed","status"]];
    const atRiskSet = new Set((latestData.at_risk || []).map(m => m.phone));
    (latestData.members || []).forEach(m => {
      rows.push([
        m.name || "",
        m.phone || "",
        m.visit_count ?? 0,
        m.last_visit_at || "",
        m.created_at || "",
        m.card_completed ? "yes" : "no",
        atRiskSet.has(m.phone) ? "at_risk" : "active",
      ]);
    });
    const csv = rows.map(r => r.map(csvEscape).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "rahi-members-" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  $('lockPin').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
