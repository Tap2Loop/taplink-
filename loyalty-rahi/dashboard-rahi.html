<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — RAHI Cà-phê Vietnam</title>
<style>
  :root{--ink:#1a3a2a;--paper:#f5f0e8;--white:#fff;--line:#e4e1da;--muted:#6a7a70;--gold:#b6862c;--gold-soft:#f8efdc;--green:#25D366;}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Segoe UI',sans-serif;min-height:100vh}
  #lockScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lock-box{background:var(--white);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(26,58,42,.08)}
  .lock-logo{font-size:32px;margin-bottom:12px}
  .lock-title{font-family:Georgia,serif;font-size:22px;font-weight:700;margin-bottom:4px}
  .lock-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
  .lock-input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px}
  .lock-input:focus{outline:none;border-color:var(--ink)}
  .lock-btn{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .lock-error{font-size:13px;color:#c0392b;margin-top:10px;min-height:20px}
  
  #dashboard{display:none}
  .topbar{background:var(--ink);color:#fff;padding:20px 24px 18px}
  .topbar-title{font-family:Georgia,serif;font-size:22px;font-weight:700}
  .topbar-sub{font-size:12px;color:#a0c0b0;margin-top:2px}
  .content{padding:24px 20px;max-width:760px;margin:0 auto}
  
  .toolbar{display:flex;gap:10px;margin-bottom:20px}
  .tool-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:600}
  .tool-btn:active{background:var(--line)}
  
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
  .stat-card{background:var(--white);border-radius:14px;padding:18px 14px;text-align:center;border:1.5px solid var(--line)}
  .stat-card.highlight{border-color:var(--gold);background:var(--gold-soft)}
  .stat-num{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1}
  .stat-card.highlight .stat-num{color:var(--gold)}
  .stat-label{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
  
  .section-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px}
  .member-list{display:flex;flex-direction:column;gap:10px}
  .member-card{background:var(--white);border-radius:12px;padding:14px 16px;border:1.5px solid var(--line);display:flex;align-items:center;gap:14px}
  .member-avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
  .member-info{flex:1;min-width:0}
  .member-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member-phone{font-size:12px;color:var(--muted);margin-top:1px}
  .member-right{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:12px}
  
  .visit-badge{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .reward-tag{font-size:11px;color:var(--gold);font-weight:600;margin-top:3px}
  .member-date{font-size:11px;color:var(--muted);margin-top:2px}
  
  /* WhatsApp Button */
  .wa-btn{background:var(--green);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
  .wa-btn:active{transform:scale(0.95)}
  .wa-btn svg{width:20px;height:20px;fill:currentColor}
  
  .footer{text-align:center;font-size:11px;color:var(--muted);padding:24px 0 12px}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-logo">☕</div>
    <div class="lock-title">RAHI Dashboard</div>
    <div class="lock-sub">Enter owner PIN to view analytics</div>
    <input type="password" id="lockPin" class="lock-input" maxlength="4" placeholder="••••">
    <button class="lock-btn" onclick="unlock()">View Dashboard</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div class="topbar-title" id="dashCafeName">Loading...</div>
    <div class="topbar-sub" id="dashLastUpdated">—</div>
  </div>
  <div class="content">
    
    <div class="toolbar">
      <button class="tool-btn" onclick="refresh()">↻ Refresh</button>
      <button class="tool-btn" onclick="copyAllNumbers()">📋 Copy All Numbers</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">Total Members</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statVisits">—</div>
        <div class="stat-label">Total Visits</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-num" id="statRewards">—</div>
        <div class="stat-label">Rewards Redeemed</div>
      </div>
    </div>

    <div class="section-title">All Members (Newest First)</div>
    <div class="member-list" id="memberList">
      <div class="empty-state" style="text-align:center;color:var(--muted);padding:20px;">Loading...</div>
    </div>
  </div>
  <div class="footer">Powered by TapReview</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* --- SET YOUR SUPABASE URL AND KEY HERE --- */
  const SUPABASE_URL = "https://udmjsnmiseqngpaozqfx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3s4xVqoIrru1M8Sk_ILl9A_vg9zRGRM";
  const CAFE_ID = "rahi"; 
  
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentPin = null;
  let latestData = null;

  async function unlock(){
    const pin = document.getElementById('lockPin').value.trim();
    if (pin.length !== 4) { document.getElementById('lockError').textContent = "Enter 4-digit PIN"; return; }
    
    const { data, error } = await db.rpc('get_dashboard', { p_cafe_id: CAFE_ID, p_pin: pin });
    
    if (error || !data || !data.success) {
      document.getElementById('lockError').textContent = data?.error || "Incorrect PIN";
      document.getElementById('lockPin').value = "";
      return;
    }
    
    currentPin = pin;
    latestData = data;
    document.getElementById('lockScreen').style.display = "none";
    document.getElementById('dashboard').style.display = "block";
    renderDashboard(data);
  }

  async function refresh(){
    if (!currentPin) return;
    const { data } = await db.rpc('get_dashboard', { p_cafe_id: CAFE_ID, p_pin: currentPin });
    if (data && data.success) {
      latestData = data;
      renderDashboard(data);
    }
  }

  function renderDashboard(data){
    document.getElementById('dashCafeName').textContent = data.name;
    document.getElementById('dashLastUpdated').textContent = "Updated " + new Date().toLocaleTimeString();

    const m = data.metrics || {};
    document.getElementById('statTotal').textContent = m.total_members ?? 0;
    document.getElementById('statVisits').textContent = m.total_visits ?? 0;
    document.getElementById('statRewards').textContent = m.rewards_redeemed ?? 0;

    const members = data.members || [];
    if (members.length === 0) {
      document.getElementById('memberList').innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">No members yet.</div>';
      return;
    }

    const html = members.map(m => {
      const name = m.name || "Unknown";
      const initials = name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2) || "?";
      const phone = m.phone ? "+91 " + m.phone.slice(0,5) + " " + m.phone.slice(5) : "—";
      
      const TOTAL = data.total_slots || 10;
      const visits = m.visit_count || 0;
      const REWARDS = data.reward_config || {};
      
      let tag = "";
      if (m.card_completed) tag = '🏆 Card complete';
      else if (REWARDS[String(visits)]) tag = '🎉 ' + REWARDS[String(visits)] + ' unlocked';
      else {
        const slots = Object.keys(REWARDS).map(Number).sort((a,b)=>a-b);
        const next = slots.find(s => s > visits);
        if (next) tag = (next - visits) + ' visits to reward';
      }

      // Create WhatsApp link
      const waLink = `https://wa.me/91${m.phone}?text=Hi ${name}, this is RAHI Cà-phê Vietnam. `;

      return `
        <div class="member-card">
          <div class="member-avatar">${initials}</div>
          <div class="member-info">
            <div class="member-name">${name}</div>
            <div class="member-phone">${phone}</div>
          </div>
          <div class="member-right">
            <div style="text-align:right;">
              <div class="visit-badge">${visits}/${TOTAL}</div>
              <div class="reward-tag">${tag}</div>
            </div>
            <a href="${waLink}" target="_blank" class="wa-btn" title="Message on WhatsApp">
              <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            </a>
          </div>
        </div>`;
    }).join('');

    document.getElementById('memberList').innerHTML = html;
  }

  function copyAllNumbers() {
    if (!latestData || !latestData.members || latestData.members.length === 0) return alert("No numbers to copy.");
    const numbers = latestData.members.map(m => m.phone).join(", ");
    navigator.clipboard.writeText(numbers).then(() => {
      alert("All phone numbers copied to clipboard!");
    }).catch(err => {
      alert("Failed to copy: " + err);
    });
  }

  document.getElementById('lockPin').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
